<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#020812" />
    <meta http-equiv="refresh" content="0; url=./react-app/index.html" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Blue Wallet</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #020812;
        color: #d9eaf3;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(520px, 100%);
        border: 1px solid rgba(127, 200, 232, 0.24);
        border-radius: 8px;
        padding: 24px;
        background: rgba(8, 24, 42, 0.86);
      }
      h1 {
        margin: 0 0 8px;
        color: #fff;
        letter-spacing: 0;
      }
      p {
        margin: 0 0 18px;
        color: #91b5c6;
        line-height: 1.5;
      }
      a {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        border-radius: 8px;
        padding: 0 14px;
        background: #63d6f7;
        color: #02111d;
        font-weight: 900;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Opening Blue Wallet</h1>
      <p>The React vault is now the production app. If it does not open automatically, continue below.</p>
      <a href="./react-app/index.html">Open Blue Wallet</a>
    </main>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./service-worker.js").catch(function () {});
      }
      window.location.replace("./react-app/index.html");
    </script>
  </body>
</html>
